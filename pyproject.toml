[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolsaml"
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Aarni Koskela", email = "akx@iki.fi" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/akx/smolsaml#readme"
Issues = "https://github.com/akx/smolsaml/issues"
Source = "https://github.com/akx/smolsaml"

[tool.hatch.version]
path = "smolsaml/__about__.py"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "smolsaml/__about__.py",
  "example*.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest]
norecursedirs = [".git", ".tox", "dist"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",  # Taken care of by Ruff
    "SIM105",
]
select = [
    "C9",
    "E",
    "F",
    "I",
    "SIM",
    "TID",
    "W",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10
